services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmapms
      POSTGRES_USER: pharmapms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pharmapms-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmapms -d pharmapms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://pharmapms:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/pharmapms?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CORS_ORIGIN: http://localhost:5173
      DEFAULT_LOCALE: en-US
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      # Development bind mount: UI source changes are picked up by Vite without
      # requiring a stale frontend image to be rebuilt.
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  pharmapms-db:
  frontend-node-modules:
